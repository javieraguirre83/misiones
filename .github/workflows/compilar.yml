name: Compilar mod

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Preparar MDK de Forge 26.2 y compilar
        id: build
        continue-on-error: true
        run: bash .github/scripts/compilar.sh

      - name: Guardar registro en la rama "registro"
        if: always()
        run: |
          mkdir -p /tmp/reg && cp -r registro/. /tmp/reg/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin registro || true
          git checkout --orphan registro-nuevo
          git rm -rf --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/reg/. .
          git add -A
          git commit -m "Registro de compilación ${{ github.run_number }}" || true
          git push -f origin registro-nuevo:registro

      - name: Publicar el .jar (pestaña Releases)
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls /tmp/mdk-out/*.jar | head -1)
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima "$JAR" \
            --title "Misiones para Forge 26.2" \
            --notes "Descarga el archivo .jar de abajo y ponlo en tu carpeta mods (Minecraft 26.2 con Forge)."

      - name: Marcar error si no compiló
        if: steps.build.outcome != 'success'
        run: exit 1
